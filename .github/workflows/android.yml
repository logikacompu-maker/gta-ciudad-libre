
name: Crear APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Instalar herramientas Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.1.13356709" \
            "cmake;3.10.2.4988404"

      - name: Instalar Godot 4.7.2
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl libfontconfig1

          mkdir -p "$GITHUB_WORKSPACE/godot"
          cd "$GITHUB_WORKSPACE/godot"

          curl -fL -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip

          unzip -q godot.zip

          chmod +x Godot_v4.7.2-stable_linux.x86_64

          ln -sf "$GITHUB_WORKSPACE/godot/Godot_v4.7.2-stable_linux.x86_64" \
            "$GITHUB_WORKSPACE/godot/godot"

          echo "$GITHUB_WORKSPACE/godot" >> "$GITHUB_PATH"

          godot --version

      - name: Instalar plantillas Android
        run: |
          curl -fL -o templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz

          mkdir -p /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"

          unzip -q templates.tpz -d /tmp/godot-templates

          cp -r /tmp/godot-templates/templates/. \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

          echo "4.7.2.stable" > \
            "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt"

      - name: Descargar y preparar juego
        run: |
          mkdir -p extracted

          unzip -q CiudadLibre_Proyecto_v02.zip -d extracted

          PROJECT_FILE=$(find extracted -type f -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No se encontró project.godot"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          sed -i '/physical_keycode=.*SHFT/d' "$PROJECT_FILE"

          mkdir -p "$PROJECT_DIR/build"

          echo "Proyecto encontrado: $PROJECT_DIR"

      - name: Configurar Android
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/CiudadLibre.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          package/unique_name="com.ciudadlibre.game"
          package/name="Ciudad Libre"
          version/code=1
          version/name="1.0"
          EOF

      - name: Importar proyecto
        run: |
          godot --headless --editor \
            --path "$PROJECT_DIR" \
            --quit

      - name: Generar APK
        run: |
          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/CiudadLibre.apk"

          if [ ! -f "$PROJECT_DIR/build/CiudadLibre.apk" ]; then
            echo "ERROR: No se pudo generar el APK"
            exit 1
          fi

          echo "APK GENERADO CORRECTAMENTE"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CiudadLibre-APK
          path: ${{ env.PROJECT_DIR }}/build/CiudadLibre.apk
          if-no-files-found: error
