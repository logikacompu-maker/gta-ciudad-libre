
name: Crear APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: 4.7.2

    steps:
      # 1. Descargar el repositorio
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # 2. Instalar Java 17
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Preparar Android SDK
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      # 4. Instalar componentes Android
      - name: Instalar herramientas Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      # 5. Instalar dependencias de Linux
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl libfontconfig1

      # 6. Descargar Godot 4.7.2
      - name: Instalar Godot
        run: |
          mkdir -p "$HOME/godot"
          cd "$HOME/godot"

          curl -fL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"

          unzip -q godot.zip

          sudo install -m 755 \
            "Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            /usr/local/bin/godot

          godot --version

      # 7. Instalar plantillas oficiales
      - name: Instalar plantillas Android
        run: |
          cd "$HOME/godot"

          curl -fL -o templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"

          unzip -q -j templates.tpz 'templates/*' \
            -d "$TEMPLATE_DIR"

          echo "${GODOT_VERSION}.stable" > "$TEMPLATE_DIR/version.txt"

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      # 8. Descargar y preparar el juego
      - name: Preparar archivos del juego
        run: |
          if [ ! -f "CiudadLibre_Proyecto_v02.zip" ]; then
            echo "ERROR: No se encuentra CiudadLibre_Proyecto_v02.zip"
            exit 1
          fi

          mkdir -p extracted

          unzip -q CiudadLibre_Proyecto_v02.zip -d extracted

          PROJECT_FILE=$(find extracted -type f -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No se encontró project.godot"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          # Corregir líneas problemáticas del proyecto
          sed -i '/_SHFT/d' "$PROJECT_FILE"

          mkdir -p "$PROJECT_DIR/build"

          echo "Proyecto encontrado: $PROJECT_DIR"

      # 9. Configurar Java y Android dentro de Godot
      - name: Configurar exportación Android
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "Android SDK: $ANDROID_HOME"
          echo "Java SDK: $JAVA_HOME"

      # 10. Crear preset Android
      - name: Crear preset de exportación
        run: |
          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/CiudadLibre.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          package/unique_name="com.ciudadlibre.game"
          package/name="Ciudad Libre"
          version/code=1
          version/name="1.0"
          EOF

      # 11. Importar proyecto
      - name: Importar proyecto
        run: |
          godot --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit

      # 12. Generar APK
      - name: Generar APK
        run: |
          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/CiudadLibre.apk"

          if [ ! -s "$PROJECT_DIR/build/CiudadLibre.apk" ]; then
            echo "ERROR: No se pudo generar el APK"
            exit 1
          fi

          echo "APK GENERADO CORRECTAMENTE"

      # 13. Guardar APK para descargar
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CiudadLibre-APK
          path: ${{ env.PROJECT_DIR }}/build/CiudadLibre.apk
          if-no-files-found: error
